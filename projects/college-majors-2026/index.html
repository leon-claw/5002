<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>College Majors 2026</title><script src="https://cdn.jsdelivr.net/npm/d3@7"></script><style>
:root{--ink:#18302b;--paper:#f6f2e9;--green:#2f775d;--orange:#e27d43;--muted:#6b766f;--grid:#d9ded5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:38px 24px 70px}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);font-weight:800}h1{font-family:Georgia,serif;font-size:clamp(38px,6vw,78px);line-height:.93;max-width:780px;margin:12px 0 18px}.deck{max-width:780px;font-size:18px;line-height:1.55;color:#5f6e67}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0}.kpi{background:#fffdf8;border-top:3px solid var(--orange);padding:16px}.kpi b{font-size:24px;display:block}.kpi span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}.card{background:#fffdf8;border:1px solid #e0e3da;padding:18px;min-height:330px}.card h2{font-family:Georgia,serif;font-size:20px;margin:0 0 4px}.card small{color:var(--muted)}svg{width:100%;height:270px}.axis path,.axis line{stroke:var(--grid)}.axis text{fill:var(--muted);font-size:10px}.dot{fill:var(--orange);opacity:.42}.bar{fill:var(--green)}.tip{position:fixed;opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:8px 10px;border-radius:3px;font-size:12px}@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style></head><body><main><div class="eyebrow">Education outcomes · 2026 profile</div><h1>专业选择是一张回报与风险的地图</h1><p class="deck">用收入、债务、就业和 AI 暴露把专业家庭放到同一张图上。每个点是一个项目观测，隐私抑制和小样本决定了我们能说到哪里。</p><section class="kpis" id="kpis"></section><div class="grid"><article class="card"><h2>收入 × 债务</h2><small>项目级描述性散点</small><div id="scatter"></div></article><article class="card"><h2>专业家庭收入</h2><small>至少 25 个项目的家庭</small><div id="family"></div></article><article class="card"><h2>AI 职业暴露</h2><small>occupation share 分箱</small><div id="ai"></div></article><article class="card"><h2>收入轨迹</h2><small>1 年到 5 年的增长分类</small><div id="trajectory"></div></article></div></main><div class="tip" id="tip"></div><script src="site/data.js"></script><script>
const $=s=>document.querySelector(s),fmt=d3.format(','),money=d3.format('$,.0f'),tip=$('#tip'),data=DATA;$('#kpis').innerHTML=[[fmt(data.summary.rows),'项目观测'],[fmt(data.summary.families),'专业家庭'],[fmt(data.summary.institutions),'机构'],[d3.format('.1%')(data.summary.missing_rate),'平均字段缺失']].map(x=>`<div class="kpi"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');function svg(sel,w=520,h=270){return d3.select(sel).append('svg').attr('viewBox',`0 0 ${w} ${h}`)}function show(e,t){tip.textContent=t;tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY+12+'px';tip.style.opacity=1}function hide(){tip.style.opacity=0}let m={l:50,r:12,t:10,b:30};d3.select('#scatter').html('');let s=svg('#scatter'),w=520,h=270,sc=data.scatter,x=d3.scaleLog().domain(d3.extent(sc,d=>d.median_debt_usd)).range([m.l,w-m.r]),y=d3.scaleLog().domain(d3.extent(sc,d=>d.median_earnings_4yr_usd)).range([h-m.b,m.t]);s.append('g').attr('class','axis').attr('transform',`translate(0,${h-m.b})`).call(d3.axisBottom(x).ticks(5,'~s'));s.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5,'~s'));s.selectAll('.dot').data(sc).join('circle').attr('class','dot').attr('cx',d=>x(d.median_debt_usd)).attr('cy',d=>y(d.median_earnings_4yr_usd)).attr('r',3).on('mousemove',(e,d)=>show(e,`${d.cip_title} · ${money(d.median_earnings_4yr_usd)} earnings · ${money(d.median_debt_usd)} debt`)).on('mouseleave',hide);
function bars(sel,arr,label,val,fmtVal){d3.select(sel).html('');let s=svg(sel),x=d3.scaleLinear().domain([0,d3.max(arr,d=>d[val])]).nice().range([m.l,w-m.r]),y=d3.scaleBand().domain(arr.map(d=>d[label])).range([m.t,h-m.b]).padding(.23);s.selectAll('.bar').data(arr).join('rect').attr('class','bar').attr('x',m.l).attr('y',d=>y(d[label])).attr('width',d=>x(d[val])-m.l).attr('height',y.bandwidth()).on('mousemove',(e,d)=>show(e,`${d[label]} · ${fmtVal(d[val])}`)).on('mouseleave',hide);s.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(y));}bars('#family',data.family.slice(0,9),'family','median_earnings',money);bars('#ai',data.ai,'ai_bin','programs',fmt);bars('#trajectory',data.trajectory.slice(0,8),'trajectory','programs',fmt);
</script></body></html>
