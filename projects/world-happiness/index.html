<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>World Happiness Report</title><script src="https://cdn.jsdelivr.net/npm/d3@7"></script><style>
:root{--ink:#24344a;--paper:#f4f0e8;--blue:#3e6f91;--gold:#d49543;--muted:#6f7b86;--grid:#d8d9d4}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:38px 24px 70px}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);font-weight:800}h1{font-family:Georgia,serif;font-size:clamp(38px,6vw,76px);line-height:.92;max-width:850px;margin:12px 0 18px}.deck{font-size:18px;line-height:1.55;color:#5f6c76;max-width:780px}.controls{display:flex;align-items:center;gap:10px;margin:26px 0}.controls select{padding:10px;border:1px solid #c9d0d4;background:#fffdf8;color:var(--ink)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.kpi{background:#fffdf8;border-top:3px solid var(--gold);padding:16px}.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}.card{background:#fffdf8;border:1px solid #e0e2df;padding:18px;min-height:330px}.card h2{font-family:Georgia,serif;font-size:20px;margin:0 0 4px}.card small{color:var(--muted)}svg{width:100%;height:270px}.axis path,.axis line{stroke:var(--grid)}.axis text{fill:var(--muted);font-size:10px}.line{fill:none;stroke:var(--blue);stroke-width:3}.dot{fill:var(--gold)}.bar{fill:var(--blue)}.whisker{stroke:var(--gold);stroke-width:3}.tip{position:fixed;opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:8px 10px;border-radius:3px;font-size:12px}@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style></head><body><main><div class="eyebrow">World Happiness Report · 2011—2025</div><h1>幸福不是一个排名，而是一条带误差的轨迹</h1><p class="deck">这份报告给出的是三年平均的 life evaluation。页面把最新排名、时间轨迹和解释维度放在一起，避免把名次差异误读成精确的国家比较。</p><div class="controls"><label for="country">查看国家</label><select id="country"></select></div><section class="kpis" id="kpis"></section><div class="grid"><article class="card"><h2>头部国家的时间轨迹</h2><small>三年平均 life evaluation</small><div id="trend"></div></article><article class="card"><h2>最新一期排名与区间</h2><small>头 10 + 尾 10；whisker 为上下界</small><div id="intervals"></div></article><article class="card"><h2>最新一期头尾排名</h2><small>分数而不是名次</small><div id="ranking"></div></article><article class="card"><h2>解释维度构成</h2><small>选定国家，分解维度仅作描述</small><div id="components"></div></article></div></main><div class="tip" id="tip"></div><script src="site/data.js"></script><script>
const $=s=>document.querySelector(s),fmt=d3.format('.2f'),num=d3.format(','),tip=$('#tip'),data=DATA;data.trend_countries.forEach(c=>$('#country').insertAdjacentHTML('beforeend',`<option>${c}</option>`));$('#kpis').innerHTML=[[num(data.summary.rows),'国家-年份记录'],[data.summary.countries,'国家'],[data.summary.date_range.join(' → '),'年份'],[d3.format('.1%')(data.summary.missing_rate),'平均字段缺失']].map(x=>`<div class="kpi"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');function svg(sel,w=520,h=270){return d3.select(sel).append('svg').attr('viewBox',`0 0 ${w} ${h}`)}function show(e,t){tip.textContent=t;tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY+12+'px';tip.style.opacity=1}function hide(){tip.style.opacity=0}let w=520,h=270,m={l:48,r:12,t:10,b:30};function drawTrend(){d3.select('#trend').html('');let s=svg('#trend'),chosen=$('#country').value,by=d3.group(data.trend,d=>d.country),x=d3.scalePoint().domain([...new Set(data.trend.map(d=>d.year))]).range([m.l,w-m.r]),y=d3.scaleLinear().domain([4,8]).range([h-m.b,m.t]);s.append('g').attr('class','axis').attr('transform',`translate(0,${h-m.b})`).call(d3.axisBottom(x).ticks(7));s.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5));let line=d3.line().x(d=>x(d.year)).y(d=>y(d.life));s.append('path').datum(by.get(chosen)).attr('class','line').attr('d',line);s.selectAll('.dot').data(by.get(chosen)).join('circle').attr('class','dot').attr('cx',d=>x(d.year)).attr('cy',d=>y(d.life)).attr('r',4).on('mousemove',(e,d)=>show(e,`${d.country} · ${d.year} · ${fmt(d.life)}`)).on('mouseleave',hide)}function bars(sel,arr,label,val,format){d3.select(sel).html('');let s=svg(sel),x=d3.scaleLinear().domain([0,d3.max(arr,d=>d[val])]).nice().range([m.l,w-m.r]),y=d3.scaleBand().domain(arr.map(d=>d[label])).range([m.t,h-m.b]).padding(.22);s.selectAll('.bar').data(arr).join('rect').attr('class','bar').attr('x',m.l).attr('y',d=>y(d[label])).attr('width',d=>x(d[val])-m.l).attr('height',y.bandwidth()).on('mousemove',(e,d)=>show(e,`${d[label]} · ${format(d[val])}`)).on('mouseleave',hide);s.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(y));}function draw(){drawTrend();let chosen=$('#country').value;bars('#ranking',data.latest,'country','life',fmt);d3.select('#intervals').html('');let s=svg('#intervals'),arr=data.intervals,ix=d3.scaleLinear().domain([0,8]).range([m.l,w-m.r]),iy=d3.scaleBand().domain(arr.map(d=>d.country)).range([m.t,h-m.b]).padding(.3);s.append('g').attr('class','axis').attr('transform',`translate(0,${h-m.b})`).call(d3.axisBottom(ix).ticks(5));s.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(iy));s.selectAll('.whisker').data(arr).join('line').attr('class','whisker').attr('x1',d=>ix(d.lower)).attr('x2',d=>ix(d.upper)).attr('y1',d=>iy(d.country)+iy.bandwidth()/2).attr('y2',d=>iy(d.country)+iy.bandwidth()/2);s.selectAll('.dot').data(arr).join('circle').attr('class','dot').attr('cx',d=>ix(d.life)).attr('cy',d=>iy(d.country)+iy.bandwidth()/2).attr('r',4).on('mousemove',(e,d)=>show(e,`${d.country} · ${fmt(d.lower)}–${fmt(d.upper)}`)).on('mouseleave',hide);let comp=data.components.find(d=>d.country===chosen);d3.select('#components').html('');s=svg('#components');let keys=['gdp','social_support','health','freedom','generosity','corruption','dystopia'],cx=d3.scaleBand().domain(keys).range([m.l,w-m.r]).padding(.2),cy=d3.scaleLinear().domain([0,2.2]).range([h-m.b,m.t]);s.append('g').attr('class','axis').attr('transform',`translate(0,${h-m.b})`).call(d3.axisBottom(cx));s.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(cy).ticks(5));s.selectAll('.bar').data(keys).join('rect').attr('class','bar').attr('x',k=>cx(k)).attr('y',k=>cy(comp[k])).attr('width',cx.bandwidth()).attr('height',k=>cy(0)-cy(comp[k]));}$('#country').addEventListener('change',draw);draw();
</script></body></html>
