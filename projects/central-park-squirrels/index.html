<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Central Park Squirrel Census</title><script src="https://cdn.jsdelivr.net/npm/d3@7"></script><style>
:root{--ink:#1b2d28;--paper:#eef2e8;--leaf:#2d7759;--rust:#c86643;--muted:#687871;--grid:#cbd6cc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:36px 24px 70px}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--leaf);font-weight:800}h1{font-family:Georgia,serif;font-size:clamp(38px,6vw,76px);line-height:.92;margin:12px 0 18px;max-width:820px}.deck{font-size:18px;line-height:1.55;color:#596b61;max-width:780px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.kpi{background:#fbfcf7;border-left:3px solid var(--rust);padding:16px}.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}.card{background:#fbfcf7;border:1px solid #dbe4d8;padding:18px;min-height:330px}.card h2{font-family:Georgia,serif;font-size:20px;margin:0 0 4px}.card small{color:var(--muted)}svg{width:100%;height:270px}.axis path,.axis line{stroke:var(--grid)}.axis text{fill:var(--muted);font-size:10px}.dot{fill:var(--rust);opacity:.5}.bar{fill:var(--leaf)}.bar.alt{fill:var(--rust)}.tip{position:fixed;opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:8px 10px;border-radius:3px;font-size:12px}@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style></head><body><main><div class="eyebrow">Citizen science · Central Park · October 2018</div><h1>一张城市公园里的松鼠观察地图</h1><p class="deck">把观测点、班次与行为拆开，看见中央公园里哪些地方更容易遇到松鼠，以及早晚观察是否带来不同的行为画像。</p><section class="kpis" id="kpis"></section><div class="grid"><article class="card"><h2>空间观测点</h2><small>经纬度散点；颜色代表毛色</small><div id="map"></div></article><article class="card"><h2>行为观察率</h2><small>布尔字段的观测比例</small><div id="behavior"></div></article><article class="card"><h2>日期 × 班次</h2><small>普查窗口内的观察量</small><div id="dates"></div></article><article class="card"><h2>毛色分类</h2><small>缺失显示为 Unknown</small><div id="colors"></div></article></div></main><div class="tip" id="tip"></div><script src="site/data.js"></script><script>
const $=s=>document.querySelector(s),fmt=d3.format(','),pct=d3.format('.1%'),tip=$('#tip'),data=DATA;$('#kpis').innerHTML=[[fmt(data.summary.rows),'松鼠观测'],[fmt(data.summary.locations),'独立坐标'],[data.summary.date_range.join(' → '),'普查日期'],[pct(data.summary.missing_rate),'平均字段缺失']].map(x=>`<div class="kpi"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');function svg(sel,w=520,h=270){return d3.select(sel).append('svg').attr('viewBox',`0 0 ${w} ${h}`)}function show(e,t){tip.textContent=t;tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY+12+'px';tip.style.opacity=1}function hide(){tip.style.opacity=0}let w=520,h=270,m={l:48,r:12,t:10,b:30};d3.select('#map').html('');let s=svg('#map'),px=d3.scaleLinear().domain(d3.extent(data.points,d=>d.X)).range([m.l,w-m.r]),py=d3.scaleLinear().domain(d3.extent(data.points,d=>d.Y)).range([h-m.b,m.t]);s.append('g').attr('class','axis').attr('transform',`translate(0,${h-m.b})`).call(d3.axisBottom(px).ticks(5));s.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(py).ticks(5));s.selectAll('.dot').data(data.points).join('circle').attr('class','dot').attr('cx',d=>px(d.X)).attr('cy',d=>py(d.Y)).attr('r',2.5).on('mousemove',(e,d)=>show(e,`${d['Unique Squirrel ID']} · ${d.shift} · ${d.fur_color}`)).on('mouseleave',hide);
function bars(sel,arr,label,val,format){d3.select(sel).html('');let s=svg(sel),x=d3.scaleLinear().domain([0,d3.max(arr,d=>d[val])]).nice().range([m.l,w-m.r]),y=d3.scaleBand().domain(arr.map(d=>d[label])).range([m.t,h-m.b]).padding(.23);s.selectAll('.bar').data(arr).join('rect').attr('class','bar').attr('x',m.l).attr('y',d=>y(d[label])).attr('width',d=>x(d[val])-m.l).attr('height',y.bandwidth()).on('mousemove',(e,d)=>show(e,`${d[label]} · ${format(d[val])}`)).on('mouseleave',hide);s.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(y));}bars('#behavior',data.behavior.slice(0,9),'behavior','rate',pct);bars('#colors',data.colors,'fur_color','squirrels',fmt);d3.select('#dates').html('');s=svg('#dates');let dx=d3.scalePoint().domain(data.dates.map(d=>d.date)).range([m.l,w-m.r]),dy=d3.scaleLinear().domain([0,d3.max(data.dates,d=>d.squirrels)]).nice().range([h-m.b,m.t]);s.append('g').attr('class','axis').attr('transform',`translate(0,${h-m.b})`).call(d3.axisBottom(dx).ticks(6));s.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(dy).ticks(5));s.selectAll('.bar').data(data.dates).join('rect').attr('class',d=>`bar ${d.shift==='PM'?'alt':''}`).attr('x',d=>dx(d.date)-4).attr('y',d=>dy(d.squirrels)).attr('width',8).attr('height',d=>dy(0)-dy(d.squirrels)).on('mousemove',(e,d)=>show(e,`${d.date} · ${d.shift} · ${fmt(d.squirrels)}`)).on('mouseleave',hide);
</script></body></html>
