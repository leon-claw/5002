<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NASA Exoplanets</title><script src="https://cdn.jsdelivr.net/npm/d3@7"></script><style>
:root{--bg:#08111f;--panel:#0e1b2d;--ink:#dbe9ff;--muted:#7f9ab7;--cyan:#55d6d0;--pink:#ff7999;--line:#263c54}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#132b49 0,#08111f 44%);color:var(--ink);font-family:Inter,system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:40px 24px 70px}.eyebrow{color:var(--cyan);letter-spacing:.18em;text-transform:uppercase;font-size:11px;font-weight:800}h1{font-size:clamp(38px,6vw,80px);letter-spacing:-.06em;max-width:820px;line-height:.9;margin:14px 0 20px}.deck{font-size:18px;line-height:1.55;color:#a7bdd3;max-width:760px}.controls{display:flex;align-items:center;gap:12px;margin:28px 0}select{background:#091727;border:1px solid var(--line);color:var(--ink);padding:10px 12px;border-radius:4px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.kpi{background:rgba(14,27,45,.8);border-left:3px solid var(--cyan);padding:16px}.kpi b{font-size:24px;display:block}.kpi span{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:rgba(14,27,45,.82);border:1px solid var(--line);padding:18px;min-height:330px}.card h2{margin:0;font-size:19px}.card small{color:var(--muted)}svg{width:100%;height:270px}.axis path,.axis line{stroke:var(--line)}.axis text{fill:var(--muted);font-size:10px}.dot{fill:var(--pink);opacity:.58}.bar{fill:var(--cyan)}.bar.alt{fill:var(--pink)}.tip{position:fixed;opacity:0;pointer-events:none;background:#f4f8ff;color:#102139;padding:8px 10px;border-radius:3px;font-size:12px;max-width:250px}@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style></head><body><main><div class="eyebrow">NASA Planetary Systems · 355 fields</div><h1>我们看到的宇宙，先经过望远镜的筛选</h1><p class="deck">把确认状态、发现方法和天球位置放在一起，观察“发现了什么”与“如何被发现”之间的差别。候选星体不会被藏起来。</p><div class="controls"><label for="status">样本状态</label><select id="status"><option>All</option><option>Confirmed</option><option>Candidate</option><option>Other</option></select></div><section class="kpis" id="kpis"></section><div class="grid"><article class="card"><h2>发现年份 × 状态</h2><small>Transit 主导的调查历史</small><div id="trend"></div></article><article class="card"><h2>发现方法</h2><small>前 12 个方法</small><div id="methods"></div></article><article class="card"><h2>天球位置</h2><small>RA / DEC，展示抽样记录</small><div id="sky"></div></article><article class="card"><h2>轨道周期与平衡温度</h2><small>仅保留三个物理字段同时存在的记录</small><div id="physical"></div></article></div></main><div class="tip" id="tip"></div><script src="site/data.js"></script><script>
const $=s=>document.querySelector(s),fmt=d3.format(','),tip=$('#tip'),data=DATA;$('#kpis').innerHTML=[[data.summary.rows,'原始记录'],[d3.format('.1%')(data.summary.confirmed_rate),'Confirmed'],[d3.format('.1%')(data.summary.candidate_rate),'Candidate'],[data.summary.columns,'字段数']].map(x=>`<div class="kpi"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
function svg(sel,w=520,h=270){return d3.select(sel).append('svg').attr('viewBox',`0 0 ${w} ${h}`)}function show(e,t){tip.textContent=t;tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY+12+'px';tip.style.opacity=1}function hide(){tip.style.opacity=0}function draw(){let state=$('#status').value;let tr=data.trend.filter(d=>state==='All'||d.status===state);d3.select('#trend').html('');let s=svg('#trend'),w=520,h=270,m={l:42,r:12,t:10,b:28},years=[...new Set(tr.map(d=>d.disc_year))],x=d3.scaleBand().domain(years).range([m.l,w-m.r]).padding(.18),y=d3.scaleLinear().domain([0,d3.max(tr,d=>d.planets)]).nice().range([h-m.b,m.t]);s.append('g').attr('class','axis').attr('transform',`translate(0,${h-m.b})`).call(d3.axisBottom(x).ticks(8));s.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5));s.selectAll('.bar').data(tr).join('rect').attr('class',d=>`bar ${d.status==='Candidate'?'alt':''}`).attr('x',d=>x(d.disc_year)).attr('y',d=>y(d.planets)).attr('width',x.bandwidth()).attr('height',d=>y(0)-y(d.planets)).on('mousemove',(e,d)=>show(e,`${d.disc_year} · ${d.status} · ${fmt(d.planets)}`)).on('mouseleave',hide);
d3.select('#methods').html('');s=svg('#methods');let md=data.methods.slice(0,8),mx=d3.scaleLinear().domain([0,d3.max(md,d=>d.planets)]).range([m.l,w-m.r]),my=d3.scaleBand().domain(md.map(d=>d.discoverymethod)).range([m.t,h-m.b]).padding(.22);s.selectAll('.bar').data(md).join('rect').attr('class','bar').attr('x',m.l).attr('y',d=>my(d.discoverymethod)).attr('width',d=>mx(d.planets)-m.l).attr('height',my.bandwidth()).on('mousemove',(e,d)=>show(e,`${d.discoverymethod}: ${fmt(d.planets)}`)).on('mouseleave',hide);s.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(my));
d3.select('#sky').html('');s=svg('#sky');let sx=d3.scaleLinear().domain([0,360]).range([m.l,w-m.r]),sy=d3.scaleLinear().domain([-90,90]).range([h-m.b,m.t]);s.append('g').attr('class','axis').attr('transform',`translate(0,${h-m.b})`).call(d3.axisBottom(sx).ticks(6));s.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(sy).ticks(5));s.selectAll('.dot').data(data.sky.filter(d=>state==='All'||d.status===state)).join('circle').attr('class','dot').attr('cx',d=>sx(d.ra)).attr('cy',d=>sy(d.dec)).attr('r',2.6).on('mousemove',(e,d)=>show(e,`${d.pl_name} · ${d.status} · ${d.discoverymethod}`)).on('mouseleave',hide);
d3.select('#physical').html('');s=svg('#physical');let ph=data.physical.filter(d=>state==='All'||d.status===state),px=d3.scaleLog().domain(d3.extent(ph,d=>d.pl_orbper)).range([m.l,w-m.r]),py=d3.scaleLog().domain(d3.extent(ph,d=>d.pl_eqt)).range([h-m.b,m.t]);s.append('g').attr('class','axis').attr('transform',`translate(0,${h-m.b})`).call(d3.axisBottom(px).ticks(5,"~s"));s.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(py).ticks(5,"~s"));s.selectAll('.dot').data(ph).join('circle').attr('class','dot').attr('cx',d=>px(d.pl_orbper)).attr('cy',d=>py(d.pl_eqt)).attr('r',3).on('mousemove',(e,d)=>show(e,`${d.pl_name} · ${d.pl_orbper.toFixed(2)} days · ${d.pl_eqt.toFixed(0)} K`)).on('mouseleave',hide)}$('#status').addEventListener('change',draw);draw();
</script></body></html>
