<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NYC Film Permits</title><script src="https://cdn.jsdelivr.net/npm/d3@7"></script><style>
:root{--ink:#14233b;--paper:#f4f0e7;--blue:#2e5b9a;--amber:#e0a83b;--muted:#697386}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:38px 24px 60px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--blue);font-weight:800}h1{font-family:Georgia,serif;font-size:clamp(36px,6vw,72px);line-height:.95;margin:12px 0 18px;max-width:760px}p{color:#526071;line-height:1.55}.deck{font-size:18px;max-width:720px}.controls{display:flex;gap:12px;align-items:center;margin:28px 0;flex-wrap:wrap}select{border:1px solid #b9c3d1;background:#fffdf8;padding:10px 14px;border-radius:4px;color:var(--ink)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0 28px}.kpi{border-top:3px solid var(--amber);background:#fffdf8;padding:16px}.kpi b{display:block;font-size:25px;margin-bottom:4px}.kpi span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}.card{background:#fffdf8;padding:18px;border:1px solid #e3ddd0;min-height:320px}.card h2{font-family:Georgia,serif;font-size:20px;margin:0 0 4px}.card small{color:var(--muted)}svg{width:100%;height:260px;overflow:visible}.axis path,.axis line{stroke:#cbd1da}.axis text{font-size:10px;fill:#697386}.bar{fill:var(--blue)}.bar:hover{fill:var(--amber)}.line{fill:none;stroke:var(--blue);stroke-width:3}.dot{fill:var(--amber);opacity:.72}.tip{position:fixed;pointer-events:none;background:var(--ink);color:white;padding:8px 10px;border-radius:3px;font-size:12px;opacity:0}@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style></head><body><main><div class="eyebrow">City permit records · 2011—2016</div><h1>纽约如何把城市变成片场</h1><p class="deck">把许可事件按时间、borough 和拍摄类型拆开，观察影视活动的城市节奏。页面中的每个点都是一条许可事件，而不是一部电影。</p><div class="controls"><label for="borough">筛选 borough</label><select id="borough"><option value="All">全部 borough</option></select></div><section class="kpis" id="kpis"></section><div class="grid"><article class="card"><h2>年度许可事件</h2><small>事件数与独立项目数</small><div id="trend"></div></article><article class="card"><h2>Borough 排名</h2><small>缺失值保留为 Unknown</small><div id="borough-chart"></div></article><article class="card"><h2>事件类型</h2><small>前 12 类 permit event</small><div id="types"></div></article><article class="card"><h2>典型拍摄时长</h2><small>仅显示 0–365 天记录的年度中位数</small><div id="duration"></div></article></div></main><div class="tip" id="tip"></div><script src="site/data.js"></script><script>
const $=s=>document.querySelector(s), tip=$('#tip'), fmt=d3.format(','); const data=DATA;
$('#kpis').innerHTML=[[data.summary.rows,'许可事件'],[data.summary.projects,'独立项目'],[data.summary.boroughs,'borough / Unknown'],[d3.format('.1%')(data.summary.missing_rate),'平均字段缺失']].map(x=>`<div class="kpi"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
data.borough.forEach(d=>$('#borough').insertAdjacentHTML('beforeend',`<option>${d.Boro_clean}</option>`));
function svg(sel,w=500,h=260){return d3.select(sel).append('svg').attr('viewBox',`0 0 ${w} ${h}`)}
function axes(s,x,y,m){s.append('g').attr('class','axis').attr('transform',`translate(0,${m.t})`).call(d3.axisBottom(x).ticks(7));s.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5))}
function draw(){const selected=$('#borough').value; const trend=selected==='All'?data.trend:data.trend_borough.filter(d=>d.Boro_clean===selected);
d3.select('#trend').html('');let s=svg('#trend'),w=500,h=260,m={l:42,r:12,t:10,b:28},x=d3.scaleBand().domain(trend.map(d=>d.year)).range([m.l,w-m.r]).padding(.2),y=d3.scaleLinear().domain([0,d3.max(trend,d=>d.permits)]).nice().range([h-m.b,m.t]);axes(s,x,y,m);s.selectAll('.bar').data(trend).join('rect').attr('class','bar').attr('x',d=>x(d.year)).attr('y',d=>y(d.permits)).attr('width',x.bandwidth()).attr('height',d=>y(0)-y(d.permits)).on('mousemove',(e,d)=>show(e,`${d.year} · ${fmt(d.permits)} events · ${fmt(d.projects)} projects`)).on('mouseleave',hide);
d3.select('#borough-chart').html('');s=svg('#borough-chart');let b=data.borough.slice(0,8),bx=d3.scaleLinear().domain([0,d3.max(b,d=>d.permits)]).range([m.l,w-m.r]),by=d3.scaleBand().domain(b.map(d=>d.Boro_clean)).range([m.t,h-m.b]).padding(.25);s.selectAll('.bar').data(b).join('rect').attr('class','bar').attr('x',m.l).attr('y',d=>by(d.Boro_clean)).attr('width',d=>bx(d.permits)-m.l).attr('height',by.bandwidth()).on('mousemove',(e,d)=>show(e,`${d.Boro_clean}: ${fmt(d.permits)} events`)).on('mouseleave',hide);s.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(by));
d3.select('#types').html('');s=svg('#types');let t=data.event_types.slice(0,8),tx=d3.scaleLinear().domain([0,d3.max(t,d=>d.permits)]).range([m.l,w-m.r]),ty=d3.scaleBand().domain(t.map(d=>d.EventType_clean)).range([m.t,h-m.b]).padding(.25);s.selectAll('.bar').data(t).join('rect').attr('class','bar').attr('x',m.l).attr('y',d=>ty(d.EventType_clean)).attr('width',d=>tx(d.permits)-m.l).attr('height',ty.bandwidth());s.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(ty));
d3.select('#duration').html('');s=svg('#duration');let dur=data.duration.filter(d=>d.median_days!=null),dx=d3.scalePoint().domain(dur.map(d=>d.year)).range([m.l,w-m.r]),dy=d3.scaleLinear().domain([0,d3.max(dur,d=>d.median_days)]).nice().range([h-m.b,m.t]);axes(s,dx,dy,m);let line=d3.line().x(d=>dx(d.year)).y(d=>dy(d.median_days));s.append('path').datum(dur).attr('class','line').attr('d',line);s.selectAll('.dot').data(dur).join('circle').attr('class','dot').attr('cx',d=>dx(d.year)).attr('cy',d=>dy(d.median_days)).attr('r',4).on('mousemove',(e,d)=>show(e,`${d.year}: ${d.median_days.toFixed(1)} days`)).on('mouseleave',hide)}
function show(e,t){tip.textContent=t;tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';tip.style.opacity=1}function hide(){tip.style.opacity=0}$('#borough').addEventListener('change',draw);draw();
</script></body></html>
