<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Steam Games V2</title><script src="https://cdn.jsdelivr.net/npm/d3@7"></script><style>
:root{--bg:#111416;--panel:#1b2022;--ink:#eef3f1;--muted:#95a5a0;--mint:#74e0b0;--orange:#ff9a5c;--line:#35403f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:40px 24px 70px}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mint);font-weight:800}h1{font-size:clamp(40px,6vw,80px);letter-spacing:-.06em;line-height:.9;max-width:820px;margin:14px 0 18px}.deck{max-width:780px;color:#b1bfba;font-size:18px;line-height:1.55}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0}.kpi{background:var(--panel);border-top:3px solid var(--orange);padding:16px}.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}.card{background:var(--panel);border:1px solid var(--line);padding:18px;min-height:330px}.card h2{font-size:20px;margin:0 0 4px}.card small{color:var(--muted)}svg{width:100%;height:270px}.axis path,.axis line{stroke:var(--line)}.axis text{fill:var(--muted);font-size:10px}.dot{fill:var(--orange);opacity:.38}.bar{fill:var(--mint)}.bar.alt{fill:var(--orange)}.tip{position:fixed;opacity:0;pointer-events:none;background:#f4f8f5;color:#15211e;padding:8px 10px;border-radius:3px;font-size:12px;max-width:260px}@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style></head><body><main><div class="eyebrow">Steam market · V2 multi-source join</div><h1>一款游戏如何穿过 Steam 的数据层</h1><p class="deck">从发行年份到价格、评价和并发玩家，把三张表的连接覆盖率与游戏市场的长尾一起展示。重复 appid 是清洗问题，也是故事的一部分。</p><section class="kpis" id="kpis"></section><div class="grid"><article class="card"><h2>发行年份</h2><small>可解析日期的游戏</small><div id="release"></div></article><article class="card"><h2>类型生态</h2><small>按 appid 去重后的游戏数</small><div id="genres"></div></article><article class="card"><h2>价格 × 并发玩家</h2><small>log 轴；点大小代表评价数</small><div id="scatter"></div></article><article class="card"><h2>来源覆盖率</h2><small>主表为 join anchor</small><div id="coverage"></div></article></div></main><div class="tip" id="tip"></div><script src="site/data.js"></script><script>
const $=s=>document.querySelector(s),fmt=d3.format(','),pct=d3.format('.1%'),money=d3.format('$,.0f'),tip=$('#tip'),data=DATA;$('#kpis').innerHTML=[[fmt(data.summary.rows),'主表游戏'],[pct(data.summary.wikidata_match_rate),'Wikidata 匹配'],[pct(data.summary.steamspy_match_rate),'SteamSpy 匹配'],[data.summary.appid_duplicates.main,'主表重复 appid']].map(x=>`<div class="kpi"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');function svg(sel,w=520,h=270){return d3.select(sel).append('svg').attr('viewBox',`0 0 ${w} ${h}`)}function show(e,t){tip.textContent=t;tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY+12+'px';tip.style.opacity=1}function hide(){tip.style.opacity=0}let w=520,h=270,m={l:48,r:12,t:10,b:30};d3.select('#release').html('');let s=svg('#release'),rx=d3.scaleBand().domain(data.release.map(d=>d.year)).range([m.l,w-m.r]).padding(.2),ry=d3.scaleLinear().domain([0,d3.max(data.release,d=>d.games)]).nice().range([h-m.b,m.t]);s.append('g').attr('class','axis').attr('transform',`translate(0,${h-m.b})`).call(d3.axisBottom(rx).ticks(8));s.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(ry).ticks(5));s.selectAll('.bar').data(data.release).join('rect').attr('class','bar').attr('x',d=>rx(d.year)).attr('y',d=>ry(d.games)).attr('width',rx.bandwidth()).attr('height',d=>ry(0)-ry(d.games)).on('mousemove',(e,d)=>show(e,`${d.year} · ${fmt(d.games)} games`)).on('mouseleave',hide);
function bars(sel,arr,label,val,format){d3.select(sel).html('');let s=svg(sel),x=d3.scaleLinear().domain([0,d3.max(arr,d=>d[val])]).nice().range([m.l,w-m.r]),y=d3.scaleBand().domain(arr.map(d=>d[label])).range([m.t,h-m.b]).padding(.22);s.selectAll('.bar').data(arr).join('rect').attr('class','bar').attr('x',m.l).attr('y',d=>y(d[label])).attr('width',d=>x(d[val])-m.l).attr('height',y.bandwidth()).on('mousemove',(e,d)=>show(e,`${d[label]} · ${format(d[val])}`)).on('mouseleave',hide);s.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(y));}bars('#genres',data.genres.slice(0,9),'genre','games',fmt);d3.select('#scatter').html('');s=svg('#scatter');let sc=data.scatter,sx=d3.scaleLog().domain([.01,d3.max(sc,d=>Math.max(.01,d.price))]).range([m.l,w-m.r]),sy=d3.scaleLog().domain([1,d3.max(sc,d=>Math.max(1,d.ccu))]).range([h-m.b,m.t]);s.append('g').attr('class','axis').attr('transform',`translate(0,${h-m.b})`).call(d3.axisBottom(sx).ticks(5,'~s'));s.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(sy).ticks(5,'~s'));s.selectAll('.dot').data(sc.filter(d=>d.price>0&&d.ccu>0)).join('circle').attr('class','dot').attr('cx',d=>sx(d.price)).attr('cy',d=>sy(d.ccu)).attr('r',d=>Math.max(2,Math.min(9,Math.sqrt(d.positive||1)/20))).on('mousemove',(e,d)=>show(e,`${d.name} · ${money(d.price)} · CCU ${fmt(d.ccu)}`)).on('mouseleave',hide);bars('#coverage',data.coverage,'source','matched_to_main',fmt);
</script></body></html>
